<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;family=Noto+Sans+Khmer:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header style="width: 100%; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-family: 'Geist', 'Noto Sans Khmer', system-ui, sans-serif; color: #1C1B1F; background: #F4F3EF">
  <a href="Search.dc.html" aria-keyshortcuts="/" style="flex: 1 1 260px; min-width: 0; height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 18px; background: #FFFFFF; border-radius: 999px; color: #6E6C73; text-decoration: none; font-size: 15px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <span style="flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">Search tasks, people, events…</span>
    <span style="font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 8px; background: #F4F3EF; color: #4A4950">/</span>
  </a>
  <a href="AddWork.dc.html" style="height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 22px 0 16px; border-radius: 999px; background: #F7C83A; color: #1C1B1F; text-decoration: none; font-size: 15px; font-weight: 600; flex-shrink: 0">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add Work</a>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":64}}'>
class Component extends DCLogic {
  // "/" opens Search from anywhere except while typing
  componentDidMount() {
    this._slash = (e) => { const t = e.target; if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return; if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return; e.preventDefault(); window.location.href = 'Search.dc.html'; };
    document.addEventListener('keydown', this._slash);
  }
  componentWillUnmount() { document.removeEventListener('keydown', this._slash); }
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
