<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My tasks · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;family=Noto+Sans+Khmer:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1B1F}
:focus-visible{outline:2px solid #1C1B1F;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1120px; overflow: hidden; background: #F4F3EF; color: #1C1B1F; font-family: 'Geist', 'Noto Sans Khmer', system-ui, sans-serif">
  <main style="box-sizing: border-box; padding: 28px 16px 120px; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; align-items: flex-end; gap: 8px; padding: 0 4px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; color: #6E6C73">Week 42</span>
        <h1 style="margin: 0; font-size: 34px; line-height: 36px; font-weight: 600; letter-spacing: -0.04em">My tasks</h1>
      </div>
      <div role="radiogroup" aria-label="View" style="display: flex; padding: 2px; gap: 2px; background: #FFFFFF; border-radius: 999px">
        <button type="button" role="radio" aria-checked="true" style="height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #1C1B1F; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">List</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #4A4950; font-family: inherit; font-size: 13px; font-weight: 600">Board</button>
      </div>
    </header>

    <div role="group" aria-label="Filter" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px">
      <button type="button" aria-pressed="true" style="flex-shrink: 0; height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #1C1B1F; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">All · 10</button>
      <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #FFFFFF; color: #1C1B1F; font-family: inherit; font-size: 13px">Top 3 · 3</button>
      <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #FFFFFF; color: #1C1B1F; font-family: inherit; font-size: 13px">Blocked · 1</button>
      <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #FFFFFF; color: #1C1B1F; font-family: inherit; font-size: 13px">Awaiting review · 1</button>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
      <section aria-label="{{g.name}}" style="background: #FFFFFF; border-radius: 24px; padding: 8px; display: flex; flex-direction: column">
        <h2 style="margin: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: {{g.bg}}; color: {{g.fg}}; font-size: 15px; line-height: 22px; font-weight: 600">
          <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 999px; background: {{g.dot}}"></span>
          <span style="flex: 1">{{g.name}}</span>
          <span style="min-width: 26px; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; color: #1C1B1F; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{g.count}}</span>
        </h2>
        <sc-for list="{{g.items}}" as="t" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 6px 8px 6px 12px; border-bottom: {{t.line}}">
            <a href="MTask.dc.html" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: #1C1B1F">
              <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; line-height: 20px; font-weight: 600; color: {{t.fg}}">{{t.title}}<sc-if value="{{t.top}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="Top 3 priority" style="width: 18px; height: 18px; flex-shrink: 0; border-radius: 999px; background: #F7C83A; display: inline-flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#1C1B1F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></span></sc-if></span>
              <span style="font-size: 12px; line-height: 16px; color: {{t.metaFg}}">{{t.meta}}</span>
            </a>
            <sc-if value="{{t.action}}" hint-placeholder-val="{{false}}"><button type="button" style="flex-shrink: 0; height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: {{t.btnBg}}; color: {{t.btnFg}}; font-family: inherit; font-size: 13px; font-weight: 600">{{t.action}}</button></sc-if>
          </div>
        </sc-for>
        <sc-if value="{{g.folded}}" hint-placeholder-val="{{false}}"><button type="button" aria-expanded="false" style="height: 44px; margin: 4px 0 0; border: 0; border-radius: 14px; background: transparent; color: #1F5E3A; font-family: inherit; font-size: 13px; font-weight: 600">Show 2 done tasks</button></sc-if>
      </section>
    </sc-for>
  </main>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px">
    <dc-import name="MTabBar" current="none" persona="employee" hint-size="358px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const t = (title, meta, opts) => Object.assign({ title, meta, top: false, action: '', btnBg: '#1C1B1F', btnFg: '#FFFFFF', fg: '#1C1B1F', metaFg: '#6E6C73' }, opts || {});
    const lines = (items) => items.map((x, i) => Object.assign(x, { line: i < items.length - 1 ? '1px solid #F0EEE9' : '0' }));
    return {
      groups: [
        { name: 'In progress', count: 1, bg: '#C9DDE8', fg: '#1C1B1F', dot: '#1C1B1F', folded: false, items: lines([t('Build the checkout API', 'Due today', { top: true, action: 'Review' })]) },
        { name: 'Needs help', count: 1, bg: '#FCE3D3', fg: '#9A3412', dot: '#C2410C', folded: false, items: lines([t('Fix receipt printer driver', 'Blocked · waiting on vendor', { action: 'Unblock', btnBg: '#FCE3D3', btnFg: '#9A3412', metaFg: '#9A3412' })]) },
        { name: 'To do', count: 5, bg: '#E7E5DF', fg: '#1C1B1F', dot: '#6E6C73', folded: false, items: lines([
          t('Check menu photos with Design', 'Due today', { top: true, action: 'Start', btnBg: '#F4F3EF', btnFg: '#1C1B1F' }),
          t('Menu sync job tests', 'Due Thu 22', { action: 'Start', btnBg: '#F4F3EF', btnFg: '#1C1B1F' }),
          t('Contract renewal check', 'Due Thu 22 · private', { action: 'Start', btnBg: '#F4F3EF', btnFg: '#1C1B1F' }),
          t('Menu sync job release', 'Due Mon 9 Nov'),
          t('Write release notes', 'Due Tue 10 Nov')
        ]) },
        { name: 'Awaiting review', count: 1, bg: '#F9D3DE', fg: '#1C1B1F', dot: '#6E4850', folded: false, items: lines([t('Coupon rules screen', 'Chenda checks it')]) },
        { name: 'Done', count: 2, bg: '#DCEFE2', fg: '#1F5E3A', dot: '#2E7D4F', folded: true, items: [] }
      ]
    };
  }
}
</script>
</body>
</html>
