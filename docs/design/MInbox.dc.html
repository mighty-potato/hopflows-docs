<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;family=Noto+Sans+Khmer:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1B1F}
:focus-visible{outline:2px solid #1C1B1F;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; overflow: hidden; background: #F4F3EF; color: #1C1B1F; font-family: 'Geist', 'Noto Sans Khmer', system-ui, sans-serif">
  <main style="box-sizing: border-box; padding: 28px 16px 120px; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; align-items: flex-end; gap: 8px; padding: 0 4px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; color: #6E6C73">3 need you</span>
        <h1 style="margin: 0; font-size: 34px; line-height: 36px; font-weight: 600; letter-spacing: -0.04em">Inbox</h1>
      </div>
      <a href="MSettings.dc.html" aria-label="Alert settings" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; color: #1C1B1F; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg></a>
    </header>

    <section aria-label="Urgent" style="background: #FFFFFF; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 0 2px #C2410C">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: #FCE3D3; color: #9A3412; font-size: 12px; font-weight: 600"><span style="width: 7px; height: 7px; border-radius: 999px; background: #C2410C"></span>Urgent</span>
        <span style="font-size: 12px; color: #6E6C73">13:06 · Chenda</span>
      </div>
      <span style="font-size: 16px; line-height: 22px; font-weight: 600">Coupon breaks payment at checkout is now yours</span>
      <div style="display: flex; gap: 8px">
        <button type="button" style="flex: 1; height: 48px; border: 0; border-radius: 999px; background: #1C1B1F; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600">Start</button>
        <a href="MNeedHelp.dc.html" style="height: 48px; padding: 0 16px; border-radius: 999px; background: #F4F3EF; color: #1C1B1F; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center">Need help</a>
        <button type="button" style="height: 48px; padding: 0 14px; border: 0; border-radius: 999px; background: #F4F3EF; color: #1C1B1F; font-family: inherit; font-size: 14px; font-weight: 600">Snooze</button>
      </div>
    </section>

    <section aria-label="Alerts" style="background: #FFFFFF; border-radius: 24px; padding: 4px 18px; display: flex; flex-direction: column">
      <sc-for list="{{alerts}}" as="a" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-bottom: {{a.line}}">
          <div style="display: flex; gap: 12px">
            <span aria-hidden="true" style="width: 10px; height: 10px; margin-top: 6px; border-radius: 999px; background: {{a.dot}}; flex-shrink: 0"></span>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; line-height: 21px">{{a.text}}</span><span style="font-size: 12px; color: #6E6C73">{{a.meta}}</span></div>
          </div>
          <sc-if value="{{a.b1}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; gap: 8px; padding-left: 22px">
              <button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: #1C1B1F; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">{{a.b1}}</button>
              <sc-if value="{{a.b2}}" hint-placeholder-val="{{false}}"><button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #F4F3EF; color: #1C1B1F; font-family: inherit; font-size: 13px; font-weight: 600">{{a.b2}}</button></sc-if>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </section>

    <section aria-label="Morning summary" style="background: #C9DDE8; color: #33454F; border-radius: 24px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
      <img src="/_blob/780266c96f9700604ecc05b950fef158" alt="Punh Punh waving" style="width: 44px; height: 44px; border-radius: 14px; object-fit: cover; flex-shrink: 0">
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; font-weight: 600; color: #1C1B1F">Morning summary · 08:00</span><span style="font-size: 13px; line-height: 19px; color: #1C1B1F">Good morning, Dara! Your three today: checkout API, menu photos, receipt footer. One meeting at 14:30.</span></div>
    </section>
  </main>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px">
    <dc-import name="MTabBar" current="inbox" persona="employee" hint-size="358px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const a = (text, meta, dot, b1, b2) => ({ text, meta, dot, b1: b1 || '', b2: b2 || '' });
    const list = [
      a('Checkout API sync moved to 14:30', 'Chenda · 12:40', '#33454F', 'Accept', 'Decline'),
      a('Write release notes was given to you', 'Chenda · 11:15', '#1C1B1F', 'Start', 'Later'),
      a('Your request “Receipt printer offline” was joined with an earlier report', '10:02', '#6E6C73'),
      a('Chenda gave you kudos for “Update receipt footer”', '10:30 · only you and your lead see this', '#F28FAA')
    ];
    return { alerts: list.map((x, i) => Object.assign(x, { line: i < list.length - 1 ? '1px solid #F0EEE9' : '0' })) };
  }
}
</script>
</body>
</html>
