<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goals · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;family=Noto+Sans+Khmer:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1B1F}
:focus-visible{outline:2px solid #1C1B1F;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1100px; overflow: hidden; background: #F4F3EF; color: #1C1B1F; font-family: 'Geist', 'Noto Sans Khmer', system-ui, sans-serif">
  <main style="box-sizing: border-box; padding: 28px 16px 120px; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; align-items: flex-end; gap: 8px; padding: 0 4px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; color: #6E6C73">Riverline Co. · Q4</span>
        <h1 style="margin: 0; font-size: 34px; line-height: 36px; font-weight: 600; letter-spacing: -0.04em">Goals</h1>
      </div>
      <a href="MSearch.dc.html" aria-label="Search" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; color: #1C1B1F; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a>
    </header>

    <section aria-label="Goals on track" style="background: #F7C83A; border-radius: 28px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: flex-end; gap: 12px">
        <span style="font-family: 'Geist Mono', monospace; font-size: 64px; line-height: 64px; font-weight: 600; letter-spacing: -0.05em">5/8</span>
        <span style="padding-bottom: 6px; font-size: 15px; font-weight: 600">Goals on track</span>
      </div>
      <div style="display: flex; gap: 6px">
        <span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: #FFFFFF; color: #9A3412; font-size: 12px; font-weight: 600"><span style="width: 7px; height: 7px; border-radius: 999px; background: #C2410C"></span>2 at risk</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: #FFFFFF; color: #9B2C24; font-size: 12px; font-weight: 600"><span style="width: 7px; height: 7px; border-radius: 999px; background: #C0352B"></span>1 off track</span>
      </div>
    </section>

    <a href="MSummary.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; background: #C9DDE8; color: #1C1B1F; text-decoration: none">
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: #33454F">Weekly summary · Mon 12 Oct</span><span style="font-size: 15px; font-weight: 600">1 new flag · 2 Deliverables done</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </a>

    <sc-for list="{{goals}}" as="g" hint-placeholder-count="4">
      <article style="background: #FFFFFF; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
          <span style="font-size: 15px; line-height: 21px; font-weight: 600">{{g.title}}</span>
          <span style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: {{g.bg}}; color: {{g.fg}}; font-size: 12px; font-weight: 600"><span style="width: 7px; height: 7px; border-radius: 999px; background: {{g.dot}}"></span>{{g.flag}}</span>
        </div>
        <div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 600; letter-spacing: -0.03em">{{g.now}}</span><span style="font-size: 12px; color: #6E6C73">target {{g.target}}</span></div>
        <div style="height: 8px; border-radius: 999px; background: #E7E5DF"><div style="height: 8px; border-radius: 999px; background: #1C1B1F; width: {{g.pct}}"></div></div>
        <sc-if value="{{g.why}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; line-height: 16px; color: #4A4950">{{g.why}}</span></sc-if>
      </article>
    </sc-for>
  </main>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px">
    <dc-import name="MTabBar" current="home" persona="leader" hint-size="358px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const f = {
      ok: { flag: 'On track', bg: '#DCEFE2', fg: '#1F5E3A', dot: '#2E7D4F' },
      risk: { flag: 'At risk', bg: '#FCE3D3', fg: '#9A3412', dot: '#C2410C' },
      off: { flag: 'Off track', bg: '#F2B8B2', fg: '#7A1F18', dot: '#C0352B' }
    };
    const g = (title, k, now, target, pct, why) => Object.assign({ title, now, target, pct, why: why || '' }, f[k]);
    return {
      goals: [
        g('Increase in-app sales by 20%', 'risk', '+14%', '+20%', '70%', 'Waiting on the payment provider · 7 days'),
        g('Onboard 40 pilot schools', 'off', '22', '40', '55%', 'Scope change · decision waiting for you'),
        g('Cut support reply time to 4h', 'ok', '5.2h', '4h', '76%'),
        g('Reach 25,000 monthly users', 'ok', '21,400', '25,000', '55%')
      ]
    };
  }
}
</script>
</body>
</html>
