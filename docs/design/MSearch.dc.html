<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;family=Noto+Sans+Khmer:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1B1F}
:focus-visible{outline:2px solid #1C1B1F;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F3EF; color: #1C1B1F; font-family: 'Geist', 'Noto Sans Khmer', system-ui, sans-serif">
  <main style="box-sizing: border-box; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 12px">
    <div role="search" style="display: flex; align-items: center; gap: 8px">
      <label for="ms-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</label>
      <div style="flex: 1; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 2px #1C1B1F">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="ms-q" type="search" value="checkout" style="flex: 1; min-width: 0; height: 48px; border: 0; background: transparent; font-family: inherit; font-size: 17px; font-weight: 500; color: #1C1B1F; outline: none">
      </div>
      <a href="MToday.dc.html" style="height: 44px; padding: 0 6px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none">Cancel</a>
    </div>
    <div role="group" aria-label="Type" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
      <button type="button" aria-pressed="true" style="flex-shrink: 0; height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #1C1B1F; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">All · 6</button>
      <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #FFFFFF; color: #1C1B1F; font-family: inherit; font-size: 13px">Tasks · 3</button>
      <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #FFFFFF; color: #1C1B1F; font-family: inherit; font-size: 13px">Requests · 2</button>
      <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #FFFFFF; color: #1C1B1F; font-family: inherit; font-size: 13px">Events · 1</button>
    </div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section aria-label="{{g.name}}" style="background: #FFFFFF; border-radius: 24px; padding: 6px 18px; display: flex; flex-direction: column">
        <h2 style="margin: 8px 0 2px; font-size: 12px; font-weight: 600; color: #6E6C73">{{g.name}}</h2>
        <sc-for list="{{g.items}}" as="r" hint-placeholder-count="2">
          <a href="{{r.href}}" style="display: flex; align-items: center; gap: 10px; min-height: 56px; border-bottom: {{r.line}}; text-decoration: none; color: #1C1B1F">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">{{r.title}}</span><span style="font-size: 12px; color: #6E6C73">{{r.meta}}</span></span>
            <span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #F4F3EF">{{r.status}}</span>
          </a>
        </sc-for>
      </section>
    </sc-for>
    <span style="padding: 0 8px; font-size: 12px; line-height: 16px; color: #6E6C73">Finds English and Khmer, even inside Khmer words. Offline, it searches what's saved on this phone.</span>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (title, meta, status, href) => ({ title, meta, status, href });
    const lines = (items) => items.map((x, i) => Object.assign(x, { line: i < items.length - 1 ? '1px solid #F0EEE9' : '0' }));
    return {
      groups: [
        { name: 'Tasks', items: lines([r('Build the checkout API', 'You · due today', 'In progress', 'MTask.dc.html'), r('Checkout error messages in Khmer', 'Pisey · Fri 30 Oct', 'To do', 'MTask.dc.html'), r('Checkout page speed', 'Vannak · 7 Oct', 'Done', 'MTask.dc.html')]) },
        { name: 'Requests', items: lines([r('Coupon breaks payment at checkout', 'You · today', 'Task', 'MRequests.dc.html'), r('Checkout button hard to see', 'Shop team · 8 Oct', 'Joined', 'MRequests.dc.html')]) },
        { name: 'Events', items: lines([r('Checkout API sync', 'Today 14:30 · Room 2', 'Meeting', 'MCalendar.dc.html')]) }
      ]
    };
  }
}
</script>
</body>
</html>
