<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Needs you · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;family=Noto+Sans+Khmer:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1B1F}
:focus-visible{outline:2px solid #1C1B1F;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1100px; overflow: hidden; background: #F4F3EF; color: #1C1B1F; font-family: 'Geist', 'Noto Sans Khmer', system-ui, sans-serif">
  <main style="box-sizing: border-box; padding: 28px 16px 120px; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; align-items: flex-end; gap: 8px; padding: 0 4px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; color: #6E6C73">{{dateLine}}</span>
        <h1 style="margin: 0; font-size: 34px; line-height: 36px; font-weight: 600; letter-spacing: -0.04em">Needs you</h1>
      </div>
      <a href="MSearch.dc.html" aria-label="Search" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; color: #1C1B1F; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a>
    </header>

    <section aria-label="Waiting on you" style="background: #F7C83A; border-radius: 28px; padding: 18px 20px; display: flex; align-items: center; gap: 16px">
      <span style="font-family: 'Geist Mono', monospace; font-size: 64px; line-height: 64px; font-weight: 600; letter-spacing: -0.05em">{{count}}</span>
      <span style="font-size: 15px; line-height: 21px; font-weight: 600">{{heroText}}</span>
    </section>

    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <section aria-label="Nothing waiting" style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 15px; font-weight: 600">You're all caught up</span>
        <span style="font-size: 13px; line-height: 18px; color: #4A4950">New requests, leave and reviews show up here the moment they arrive.</span>
      </section>
    </sc-if>
    <sc-if value="{{hasNeeds}}" hint-placeholder-val="{{true}}">
    <section aria-label="To do" style="background: #FFFFFF; border-radius: 24px; padding: 4px 16px; display: flex; flex-direction: column">
      <sc-for list="{{needs}}" as="n" hint-placeholder-count="6">
        <a href="{{n.href}}" aria-label="{{n.action}}: {{n.kind}}, {{n.title}}" style="display: flex; align-items: center; gap: 10px; min-height: 68px; border-bottom: {{n.line}}; color: #1C1B1F; text-decoration: none">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: {{n.kbg}}; color: {{n.kfg}}">{{n.kind}}</span>
            <span style="font-size: 15px; line-height: 20px; font-weight: 600">{{n.title}}</span>
          </div>
          <span style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 600; color: #4A4950">{{n.action}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></span>
        </a>
      </sc-for>
    </section>
    </sc-if>

    <section aria-label="Team this week" style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #4A4950">Team this week</h2>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px">
        <sc-for list="{{team}}" as="p" hint-placeholder-count="6">
          <div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 14px; background: {{p.bg}}; color: {{p.fg}}">
            <span style="font-size: 13px; font-weight: 600; color: #1C1B1F">{{p.name}}</span>
            <span style="font-size: 12px; font-weight: 600">{{p.word}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px">
    <dc-import name="MTabBar" current="home" persona="lead" hint-size="358px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seed":{"editor":"enum","options":["shared","normal","busy","quiet"],"default":"shared"},"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._hf = () => { let v = null; try { v = window.localStorage.getItem('hopflows.seed'); } catch (e) {} if (v && v !== (this.state && this.state.hfSeed)) this.setState({ hfSeed: v, hfLocal: null }); };
    this._hf(); try { window.addEventListener('storage', this._hf); } catch (e) {} this._hfT = setInterval(this._hf, 1000);
  }
  componentWillUnmount() { try { window.removeEventListener('storage', this._hf); } catch (e) {} clearInterval(this._hfT); }
  seed() { const p = this.props.seed; return (p && p !== 'shared') ? p : ((this.state && this.state.hfSeed) || 'normal'); }
  local() { return (this.state && this.state.hfLocal) || {}; }
  setLocal(patch) { this.setState({ hfLocal: Object.assign({}, this.local(), patch) }); }
  renderVals() {
    const seed = this.seed();
    const tone = { help: ['#FCE3D3', '#9A3412'], plain: ['#F4F3EF', '#1C1B1F'] };
    const n = (kind, t, title, action, href) => ({ kind, kbg: tone[t][0], kfg: tone[t][1], title, action, href });
    const cap = { room: ['Room', '#DCEFE2', '#1F5E3A'], balanced: ['Balanced', '#C9DDE8', '#33454F'], buffer: ['Using buffer', '#FCE3D3', '#9A3412'], over: ['Too much', '#F2B8B2', '#7A1F18'], away: ['Away', 'repeating-linear-gradient(45deg, #ECEAE4 0 6px, #E0DED7 6px 12px)', '#4A4950'] };
    const ALL = {
      normal: { date: 'Fri 16 Oct · Technical', hero: 'things wait on you. The team looks OK otherwise.', needs: [
          n('Need help', 'help', 'Rithy · Payment webhook times out', 'Open', 'MInbox.dc.html'),
          n('New requests', 'plain', '4 to sort · 1 looks like a duplicate', 'Sort', 'MSort.dc.html'),
          n('Leave', 'plain', 'Dara · Thu 22 – Fri 23 Oct', 'Decide', 'MApprove.dc.html'),
          n('Review', 'plain', 'Dara · Coupon rules screen', 'Review', 'MTask.dc.html'),
          n('Week status', 'plain', 'Vannak says Full, colour shows Room', 'Look', 'MInbox.dc.html'),
          n('Routine', 'plain', 'Close shop checklist, Saturday', 'Assign', 'MInbox.dc.html')],
        team: [['Dara Sok', 'balanced'], ['Pisey Chea', 'balanced'], ['Rithy Heng', 'buffer'], ['Sophal Ouk', 'room'], ['Sreymom Ly', 'away'], ['Vannak Prum', 'room']] },
      busy: { date: 'Mon 9 Nov · Technical', hero: 'things wait on you. 3 people have more work than time.', count: 14, needs: [
          n('Need help', 'help', 'Rithy · Payment webhook times out', 'Open', 'MInbox.dc.html'),
          n('Need help', 'help', 'Dara · Receipt printer driver, vendor silent', 'Open', 'MInbox.dc.html'),
          n('New requests', 'plain', '9 to sort · 3 marked urgent', 'Sort', 'MSort.dc.html'),
          n('Leave', 'plain', 'Dara and Pisey both off Thu 12 Nov', 'Decide', 'MApprove.dc.html'),
          n('Review', 'plain', '3 tasks wait for your check', 'Review', 'MTask.dc.html'),
          n('Week status', 'plain', 'Dara, Rithy and Vannak say Too much', 'Look', 'MInbox.dc.html')],
        team: [['Dara Sok', 'over'], ['Pisey Chea', 'buffer'], ['Rithy Heng', 'over'], ['Sophal Ouk', 'balanced'], ['Sreymom Ly', 'away'], ['Vannak Prum', 'over']] },
      quiet: { date: 'Fri 16 Oct · Technical', hero: 'Nothing waits on you. The team has room this week.', count: 0, needs: [],
        team: [['Dara Sok', 'room'], ['Pisey Chea', 'balanced'], ['Rithy Heng', 'room'], ['Sophal Ouk', 'room'], ['Sreymom Ly', 'balanced'], ['Vannak Prum', 'room']] }
    };
    const d = ALL[seed] || ALL.normal;
    const needs = d.needs.map((x, i, a) => Object.assign(x, { line: i < a.length - 1 ? '1px solid #F0EEE9' : '0' }));
    return {
      dateLine: d.date, count: d.count ?? needs.length, heroText: d.hero,
      needs, hasNeeds: needs.length > 0, empty: needs.length === 0,
      team: d.team.map(([name, c]) => ({ name, word: cap[c][0], bg: cap[c][1], fg: cap[c][2] }))
    };
  }
}
</script>
</body>
</html>
