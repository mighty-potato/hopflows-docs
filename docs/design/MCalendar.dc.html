<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;family=Noto+Sans+Khmer:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1B1F}
:focus-visible{outline:2px solid #1C1B1F;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 960px; overflow: hidden; background: #F4F3EF; color: #1C1B1F; font-family: 'Geist', 'Noto Sans Khmer', system-ui, sans-serif">
  <main style="box-sizing: border-box; padding: 28px 16px 120px; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; align-items: flex-end; gap: 8px; padding: 0 4px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; color: #6E6C73">Week 42</span>
        <h1 style="margin: 0; font-size: 34px; line-height: 36px; font-weight: 600; letter-spacing: -0.04em">October</h1>
      </div>
      <button type="button" aria-label="Show or hide holidays, meetings, deadlines and leave" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #FFFFFF; color: #1C1B1F; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"></path></svg></button>
      <button type="button" aria-label="New event" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #1C1B1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    </header>

    <div role="radiogroup" aria-label="View" style="display: grid; grid-template-columns: 1fr 1fr; padding: 4px; gap: 4px; background: #FFFFFF; border-radius: 999px">
      <button type="button" role="radio" aria-checked="{{weekOn}}" onClick="{{pickWeek}}" style="height: 40px; border: 0; border-radius: 999px; background: {{weekBg}}; color: {{weekFg}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Week</button>
      <button type="button" role="radio" aria-checked="{{monthOn}}" onClick="{{pickMonth}}" style="height: 40px; border: 0; border-radius: 999px; background: {{monthBg}}; color: {{monthFg}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Month</button>
    </div>

    <sc-if value="{{isMonth}}" hint-placeholder-val="{{false}}">
    <div role="grid" aria-label="October 2026" style="padding: 10px 8px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 2px">
      <div role="row" style="display: grid; grid-template-columns: repeat(7, 1fr)">
        <sc-for list="{{dows}}" as="w" hint-placeholder-count="7"><span role="columnheader" style="text-align: center; font-size: 11px; color: #6E6C73; padding: 4px 0">{{w}}</span></sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px">
        <sc-for list="{{cells}}" as="d" hint-placeholder-count="35">
          <button type="button" role="gridcell" aria-selected="{{d.sel}}" aria-label="{{d.aria}}" onClick="{{d.pick}}" style="height: 46px; border: 0; border-radius: 14px; background: {{d.bg}}; color: {{d.fg}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; visibility: {{d.vis}}">
            <span style="font-family: 'Geist Mono', monospace; font-size: 14px; font-weight: 600">{{d.n}}</span>
            <span aria-hidden="true" style="width: 5px; height: 5px; border-radius: 999px; background: {{d.dot}}"></span>
          </button>
        </sc-for>
      </div>
    </div>
    </sc-if>

    <sc-if value="{{isWeek}}" hint-placeholder-val="{{true}}">
    <div role="tablist" aria-label="Days" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 8px; border-radius: 24px; background: #FFFFFF">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <button type="button" role="tab" aria-selected="{{d.sel}}" aria-label="{{d.aria}}" style="height: 64px; border: 0; border-radius: 16px; background: {{d.bg}}; color: {{d.fg}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer">
          <span style="font-size: 11px; opacity: 0.8">{{d.dow}}</span>
          <span style="font-family: 'Geist Mono', monospace; font-size: 16px; font-weight: 600">{{d.n}}</span>
          <span aria-hidden="true" style="width: 5px; height: 5px; border-radius: 999px; background: {{d.dot}}"></span>
        </button>
      </sc-for>
    </div>
    </sc-if>

    <h2 style="margin: 4px 4px 0; font-size: 13px; font-weight: 600; color: #4A4950">Today · Fri 16</h2>
    <a href="MToday.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: #C9DDE8; text-decoration: none; color: #1C1B1F">
      <span style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 600; width: 44px">14:30</span>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Checkout API sync</span><span style="font-size: 12px; color: #33454F">30 min · Room 2 · You said Yes</span></span>
    </a>
    <a href="MTask.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #1C1B1F; text-decoration: none; color: #1C1B1F">
      <span style="font-size: 12px; font-weight: 600; width: 44px">Due</span>
      <span style="flex: 1; font-size: 15px; font-weight: 600">Build the checkout API</span>
      <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #4A4950">17:00</span>
    </a>
    <a href="MMyTasks.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #1C1B1F; text-decoration: none; color: #1C1B1F">
      <span style="font-size: 12px; font-weight: 600; width: 44px">Due</span>
      <span style="flex: 1; font-size: 15px; font-weight: 600">Check menu photos</span>
    </a>

    <h2 style="margin: 8px 4px 0; font-size: 13px; font-weight: 600; color: #4A4950">Mon 19</h2>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: #C9DDE8">
      <span style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 600; width: 44px">09:00</span>
      <span style="flex: 1; font-size: 15px; font-weight: 600">Sprint planning</span>
    </div>

    <h2 style="margin: 8px 4px 0; font-size: 13px; font-weight: 600; color: #4A4950">Thu 22 – Fri 23</h2>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: repeating-linear-gradient(45deg, #ECEAE4 0 6px, #E0DED7 6px 12px)">
      <span style="font-size: 12px; font-weight: 600; width: 44px">Away</span>
      <span style="flex: 1; font-size: 15px; font-weight: 600">Your leave · waiting for Chenda</span>
    </div>
  </main>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px">
    <dc-import name="MTabBar" current="calendar" persona="employee" hint-size="358px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["week","month"],"default":"week"},"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.sel) || 16;
    const view = (this.state && this.state.view) || this.props.view || 'week';
    const month = view === 'month';
    const kinds = { 1: 'holiday', 2: 'due', 6: 'meet', 13: 'due', 15: 'holiday', 16: 'meet', 19: 'meet', 20: 'meet', 21: 'meet', 22: 'leave', 23: 'leave', 26: 'due', 29: 'meet', 31: 'holiday' };
    const mdots = { due: '#C0352B', holiday: '#6E6C73', meet: '#33454F', leave: '#4A4950' };
    const cells = [];
    for (let i = 0; i < 35; i++) {
      const n = i - 2; // 1 October 2026 is a Thursday
      const inMonth = n >= 1 && n <= 31;
      const on = n === sel;
      const k = kinds[n];
      cells.push({ n: inMonth ? String(n) : '', vis: inMonth ? 'visible' : 'hidden', sel: on ? 'true' : 'false', aria: inMonth ? 'October ' + n + (k ? ', ' + k : '') : '', bg: on ? '#1C1B1F' : (n === 16 ? '#F4F3EF' : (k === 'holiday' ? '#E7E5DF' : 'transparent')), fg: on ? '#FFFFFF' : '#1C1B1F', dot: on && k ? '#F7C83A' : (k ? mdots[k] : 'transparent'), pick: () => this.setState({ sel: n }) });
    }
    const info = { 12: ['Mon', 'none'], 13: ['Tue', 'due'], 14: ['Wed', 'none'], 15: ['Thu', 'holiday'], 16: ['Fri', 'meet'], 17: ['Sat', 'none'], 18: ['Sun', 'none'] };
    const dots = { none: 'transparent', due: '#C0352B', holiday: '#6E6C73', meet: '#33454F' };
    const notes = { none: '', due: ', 1 overdue', holiday: ", King Father's Commemoration Day", meet: ', 1 meeting, 2 due' };
    return {
      isMonth: month, isWeek: !month,
      weekOn: month ? 'false' : 'true', monthOn: month ? 'true' : 'false',
      weekBg: month ? 'transparent' : '#1C1B1F', weekFg: month ? '#4A4950' : '#FFFFFF',
      monthBg: month ? '#1C1B1F' : 'transparent', monthFg: month ? '#FFFFFF' : '#4A4950',
      pickWeek: () => this.setState({ view: 'week' }), pickMonth: () => this.setState({ view: 'month' }),
      dows: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], cells,
      days: Object.keys(info).map((n) => {
        const on = Number(n) === sel;
        return { n, dow: info[n][0], sel: on ? 'true' : 'false', aria: info[n][0] + ' ' + n + notes[info[n][1]], bg: on ? '#1C1B1F' : (info[n][1] === 'holiday' ? '#E7E5DF' : 'transparent'), fg: on ? '#FFFFFF' : '#1C1B1F', dot: on ? '#F7C83A' : dots[info[n][1]] };
      })
    };
  }
}
</script>
</body>
</html>
