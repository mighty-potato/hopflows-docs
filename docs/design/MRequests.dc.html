<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Requests I sent · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;family=Noto+Sans+Khmer:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1B1F}
:focus-visible{outline:2px solid #1C1B1F;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 960px; overflow: hidden; background: #F4F3EF; color: #1C1B1F; font-family: 'Geist', 'Noto Sans Khmer', system-ui, sans-serif">
  <main style="box-sizing: border-box; padding: 20px 16px 120px; display: flex; flex-direction: column; gap: 12px">
    <a href="MMenu.dc.html" aria-label="Back to Menu" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1C1B1F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
      <h1 style="margin: 0; font-size: 30px; line-height: 34px; font-weight: 600; letter-spacing: -0.04em">Requests I sent</h1>
      <span style="font-size: 13px; color: #4A4950">You hear back on every one</span>
    </div>
    <div role="tablist" aria-label="Filter" style="display: grid; grid-template-columns: 1fr 1fr; padding: 4px; gap: 4px; background: #FFFFFF; border-radius: 999px">
      <button type="button" role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 999px; background: #1C1B1F; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">Open · 3</button>
      <button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 999px; background: transparent; color: #4A4950; font-family: inherit; font-size: 13px; font-weight: 600">All · 7</button>
    </div>
    <sc-for list="{{items}}" as="r" hint-placeholder-count="5">
      <article style="background: #FFFFFF; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
          <span style="font-size: 15px; line-height: 21px; font-weight: 600">{{r.title}}</span>
          <span style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: {{r.bg}}; color: {{r.fg}}; font-size: 12px; font-weight: 600"><span style="width: 7px; height: 7px; border-radius: 999px; background: {{r.dot}}"></span>{{r.status}}</span>
        </div>
        <span style="font-size: 14px; line-height: 20px; color: #4A4950">{{r.said}}</span>
        <span style="font-size: 12px; color: #6E6C73">{{r.meta}}</span>
      </article>
    </sc-for>
  </main>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px">
    <dc-import name="MTabBar" current="menu" persona="employee" hint-size="358px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const st = {
      waiting: { status: 'Waiting', bg: '#F4F3EF', fg: '#1C1B1F', dot: '#6E6C73' },
      task: { status: 'Task', bg: '#C9DDE8', fg: '#1C1B1F', dot: '#1C1B1F' },
      joined: { status: 'Joined', bg: '#F4F3EF', fg: '#1C1B1F', dot: '#1C1B1F' },
      later: { status: 'Postponed', bg: '#FCE3D3', fg: '#9A3412', dot: '#C2410C' },
      done: { status: 'Done', bg: '#DCEFE2', fg: '#1F5E3A', dot: '#2E7D4F' }
    };
    const r = (title, said, meta, s) => Object.assign({ title, said, meta }, st[s]);
    return {
      items: [
        r('Coupon breaks payment at checkout', 'Now a task for Rithy.', 'Today 13:02 · app', 'task'),
        r('Add Khmer search to the menu', 'Waiting for Chenda. Usually within a day.', 'Today 09:40 · Telegram', 'waiting'),
        r('Khmer font in menu PDFs', 'Back on Tue 3 November.', 'Mon 12 Oct · app', 'later'),
        r('Receipt printer offline at Toul Kork', 'Joined with an earlier report.', 'Tue 13 Oct · Telegram', 'joined'),
        r('Resize menu photos for the app', 'Done by Sreymom on Wed 14 Oct.', 'Thu 8 Oct · app', 'done')
      ]
    };
  }
}
</script>
</body>
</html>
