<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;family=Noto+Sans+Khmer:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1B1F}
:focus-visible{outline:2px solid #1C1B1F;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 960px; overflow: hidden; background: #F4F3EF; color: #1C1B1F; font-family: 'Geist', 'Noto Sans Khmer', system-ui, sans-serif">
  <main style="box-sizing: border-box; padding: 28px 16px 120px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; padding: 0 4px; font-size: 34px; line-height: 36px; font-weight: 600; letter-spacing: -0.04em">Menu</h1>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
      <section aria-label="You" style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <span style="width: 44px; height: 44px; border-radius: 999px; background: #C9DDE8; color: #33454F; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">DS</span>
        <div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Dara Sok</span><span style="font-size: 12px; color: #6E6C73">Technical · Riverline Co.</span></div>
      </section>
      <section aria-label="Your streak" style="position: relative; overflow: hidden; background: #F9D3DE; color: #6E4850; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px">Your streak</span>
        <span style="font-family: 'Geist Mono', monospace; font-size: 30px; line-height: 34px; font-weight: 600; letter-spacing: -0.04em; color: #1C1B1F">12</span>
        <span style="font-size: 12px">days · only you</span>
        <img src="/_blob/a431a6fdd4e19f548f54f9fd97283158" alt="Punh Punh waving" style="position: absolute; right: -6px; bottom: -8px; width: 64px; height: 64px; border-radius: 18px; object-fit: cover">
      </section>
    </div>

    <nav aria-label="My work" style="background: #FFFFFF; border-radius: 24px; padding: 4px 18px; display: flex; flex-direction: column">
      <sc-for list="{{work}}" as="l" hint-placeholder-count="5">
        <a href="{{l.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: {{l.line}}; text-decoration: none; color: #1C1B1F">
          <span style="flex: 1; font-size: 15px; font-weight: 500">{{l.label}}</span>
          <span style="font-size: 12px; color: #6E6C73">{{l.meta}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6C73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </nav>

    <section aria-label="App" style="background: #FFFFFF; border-radius: 24px; padding: 4px 18px; display: flex; flex-direction: column">
      <a href="MSettings.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid #F0EEE9; text-decoration: none; color: #1C1B1F"><span style="flex: 1; font-size: 15px; font-weight: 500">Alerts &amp; Telegram</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6C73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 58px; border-bottom: 1px solid #F0EEE9">
        <span id="mm-lang" style="flex: 1; font-size: 15px; font-weight: 500">Language</span>
        <div role="radiogroup" aria-labelledby="mm-lang" style="display: flex; padding: 2px; gap: 2px; background: #F4F3EF; border-radius: 999px">
          <button type="button" role="radio" aria-checked="false" lang="km" style="height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #4A4950; font-family: inherit; font-size: 13px; font-weight: 600">ខ្មែរ</button>
          <button type="button" role="radio" aria-checked="true" style="height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #1C1B1F; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">English</button>
        </div>
      </div>
      <a href="MSignIn.dc.html" style="display: flex; align-items: center; min-height: 54px; text-decoration: none; color: #1C1B1F; font-size: 15px; font-weight: 500">Sign out</a>
    </section>
  </main>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px">
    <dc-import name="MTabBar" current="menu" persona="employee" hint-size="358px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const l = (label, meta, href) => ({ label, meta, href });
    const list = [
      l('My tasks', '10', 'MMyTasks.dc.html'),
      l('Requests I sent', '3 open', 'MRequests.dc.html'),
      l('My week & leave', 'Balanced', 'MWeek.dc.html'),
      l('Routines today', '1 left', 'MRoutine.dc.html'),
      l('Search', '', 'MSearch.dc.html')
    ];
    return { work: list.map((x, i) => Object.assign(x, { line: i < list.length - 1 ? '1px solid #F0EEE9' : '0' })) };
  }
}
</script>
</body>
</html>
